name: ZAP güvenlik taraması

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline taraması
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://steam-pazar-panosu.ozdizdarberil.workers.dev"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-raporu
          cmd_options: "-a"
